[package]
name = "recollect-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Prototype of a general compute core over a graph, with worlds as a value type on top. See docs/graph-core.md."

[dependencies]
recollect-graph-macros = { path = "../recollect-graph-macros" }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
schemars = { workspace = true, features = ["uuid1"] }
stacker = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
recollect-systems = { path = "../recollect-systems" }
tempfile.workspace = true
