[workspace]
resolver = "3"
members = ["crates/recollect-server", "crates/recollect-kernel", "crates/recollect-graph", "crates/recollect-graph-macros", "crates/recollect-systems"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
schemars = "1.0"
toml = "0.9"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
rmcp = { version = "3.6", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
notify = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
