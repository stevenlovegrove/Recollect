name = "The trolley problem"
about = "A runaway trolley will kill five people. In one case you can pull a switch to send it down a side track, where it will kill one. In another you can only stop it by pushing a man off a footbridge into its path. In a third, the side track loops back, and the one person on it stops the trolley with their body. What you do in each case is yours to choose. Three things are worked out from your choices, each true or false: whether the most lives are saved, whether you kill no one, and whether no one is used as a means. Each is only a value until you require it, which turns it into a principle: then only the choices that keep it true are left. Require one from its card and see what it permits, then require two and see whether anything is left. Most people would pull the switch and wouldn't push the man. Pin those two and see which values survive, and what they say about the loop."
systems = ["plan"]
