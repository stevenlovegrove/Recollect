cells:
  body: True when you act in none of them, since in each the one person dies by what you do. As a principle, it's that some things may not be done whatever they prevent. It's a value until it's required. Require it, from its card, to see what it leaves you free to do.
  name: You kill no one
formulas:
  value: 'all(c in case: c.chosen.value = "no")'
