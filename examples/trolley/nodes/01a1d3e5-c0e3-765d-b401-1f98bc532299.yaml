cells:
  body: 'True unless you act where the five are saved only because someone''s body stops the trolley. That''s worked out from what each case says happens: would the five still be saved if that person weren''t there? As a principle, it''s that you may not treat a person as a tool. It''s a value until it''s required. Require it, from its card, to see what it leaves you free to do.'
  name: No one is used as a means
formulas:
  value: 'all(c in case: !(c.chosen.value = "yes" && c.body_stops_it && !c.sent_away))'
