cells:
  body: 'The trolley will kill five people. You can pull a switch to send it down a side track, where one person is standing. That sends it away from the five for good. The one person dies because they happen to be there: with the side track empty, the five would be saved just the same.'
  body_stops_it: false
  name: Pull the switch?
  options:
  - yes
  - no
  sent_away: true
