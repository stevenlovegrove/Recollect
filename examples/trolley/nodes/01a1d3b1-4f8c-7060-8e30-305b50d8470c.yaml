id: 01a1d3b1-4f8c-7060-8e30-305b50d8470c
components:
- notes
cells:
  body: 'A case says two things about what happens if you act: whether the trolley is sent away from the five for good, and whether someone''s body stops it. The rest is worked out, by the same formulas for every case.'
  name: Case
formulas:
  permitted: self.saves_five && save.chosen.value = "accept" && kill.chosen.value = "reject" && !(means.chosen.value = "accept" && self.uses_someone)
  saves_five: self.sent_away || self.body_stops_it
  saves_five_without_them: self.sent_away
  uses_someone: self.saves_five && !self.saves_five_without_them
