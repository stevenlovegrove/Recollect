name = "Free will, step by step"
about = "Can we act freely if everything we do was settled before we were born? This lays out the argument that we can't, a step at a time. Four premises are each accepted or rejected: that everything is settled by what came before, that the past and the laws of nature aren't up to you, that what follows from things not up to you isn't up to you either, and that we act freely. Two steps are worked out from them, ending in the conclusion that what you do isn't up to you. Nothing says the four premises conflict: that follows from the steps, and from one requirement that an act can't be both up to you and not. Each position philosophers hold is the premise it gives up. Pin the premises you're surest of and see which one has to go."
systems = ["plan"]
