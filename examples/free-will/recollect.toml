name = "Free will: three claims that can't all be true"
about = "Three claims about free will each seem right on their own: everything that happens is settled by what came before, an act that was settled beforehand isn't free, and we do act freely. They can't all be true together, so at least one has to go, and each way of giving one up is a position philosophers hold. Each claim is something you accept or reject, and one requirement says they aren't all accepted. Pin the two you're surest of and see that the third is forced, and which position that makes you."
systems = ["plan"]
