id: 01a1ddc9-fc8b-77fd-a12d-d0505ae6dd00
components:
- notes
cells:
  body: Ten more, not fitted to. Each has a prediction of their 10k three ways, and their real 10k beside it, to say how each did.
  name: Newcomers
formulas:
  alone: 'predict(r in Runners.rows: r.t10k)'
  fell_alone: chance(self.alone < self.t10k)
  fell_from_5k: chance(self.from_5k < self.t10k)
  fell_log_5k: chance(self.log_5k < self.t10k)
  from_5k: 'predict(r in Runners.rows: r.t10k, r.t5k)'
  inside_alone: abs(self.fell_alone - 0.5) < 0.45
  inside_from_5k: abs(self.fell_from_5k - 0.5) < 0.45
  inside_log_5k: abs(self.fell_log_5k - 0.5) < 0.45
  log_5k: 'exp(predict(r in Runners.rows: ln(r.t10k), ln(r.t5k)))'
  miss_alone: abs(mean(self.alone) - self.t10k)
  miss_from_5k: abs(mean(self.from_5k) - self.t10k)
  miss_log_5k: abs(mean(self.log_5k) - self.t10k)
