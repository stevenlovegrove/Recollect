name = "Bertrand's box"
about = "Three boxes: two gold coins, two silver, and one of each. You take a coin from a box without looking, and it's gold. How likely is the other coin in that box to be gold? Not a half: two of the three gold coins you could be holding are in the box with two. Three questions, each inside the one before: a box, a coin from it, and the coin that's left."
systems = ["plan"]
