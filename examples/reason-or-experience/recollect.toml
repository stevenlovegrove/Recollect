name = "Reason or experience?"
about = "Where does knowledge come from? One answer is reason alone, and the opposite answer is experience alone. Any answer has to explain two things: why mathematics couldn't have been otherwise, and why we have to look to find out how the world is. Each answer explains one of them, and claims the other too, which stands until you accept the objection to it. The objections are there to accept or reject. Accept both and neither answer survives, so what's left is the gap: an answer nobody has named yet. This is a dialectic, with a thesis, its antithesis, and the need for a synthesis that keeps what each got right. Name one, and say what it explains, to close the gap."
systems = ["plan"]
