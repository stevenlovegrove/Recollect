name = "Reason or experience?"
about = "Where does knowledge come from? One answer is reason alone, and the opposite answer is experience alone. Each explains something the other can't: reason explains why mathematics couldn't have been otherwise, and experience explains why we have to look to find out how the world is. Put in both as things any answer has to explain, and neither answer survives. What's left is the gap: an answer nobody has named yet. This is a dialectic, with a thesis, its antithesis, and the need for a synthesis that keeps what each got right. Name one, and say what it explains, to close the gap."
systems = ["plan"]
