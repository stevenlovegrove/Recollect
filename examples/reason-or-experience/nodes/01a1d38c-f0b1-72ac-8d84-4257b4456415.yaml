cells:
  body: 'The antithesis. The mind starts empty, and everything in it comes through the senses. This explains why we have to look. It can''t explain why two and two couldn''t have made five: experience only says what has happened so far.'
  explains_necessity: false
  explains_observation: true
  name: From experience alone
