cells:
  body: |-
    A game show has three doors, with a car behind one and goats behind the other two. You pick a door. The host, Monty, knows where the car is: he opens one of the other two doors to show a goat, then offers you the chance to switch to the door that's left. Should you?

    Most people say it makes no difference. In fact **switching wins two times in three**, and sticking only one time in three.

    Here it's four questions, asked in order:

    1. Where the car is.
    2. Which door you pick.
    3. Which door Monty opens: never yours, and never the car's.
    4. Whether you stick or switch.

    **Things to try**

    - Pin your pick and the door Monty opens, and see the probability that the car is behind each door.
    - Open **Decisions** to compare sticking with switching.
    - Click **require** on **You win the car**, and set its **at least** to 0.6 in the panel on the right. Sticking or switching is made knowing which door Monty opened, so it's judged for each: only switching is left, whichever he opens. At 0.7, nothing is.
    - Select **Chance of winning**: how likely you are to win for each way your choices go, over where the car is and what Monty does.
  name: About this example
