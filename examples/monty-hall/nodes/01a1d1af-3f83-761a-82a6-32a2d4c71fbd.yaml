cells:
  body: 'Never yours, and never the car''s. Saying only that, as a rule that the door he opens isn''t either, would get the famous wrong answer: with the car behind your door there are two ways for him to open a door and otherwise one, so the rule alone would count the car being behind yours twice.'
  name: The door Monty's rules give
formulas:
  value: if(car.chosen = pick.chosen, if(goats.chosen.lower, if(pick.chosen.number = 1, 2, 1), if(pick.chosen.number = 3, 2, 3)), 6 - car.chosen.number - pick.chosen.number)
